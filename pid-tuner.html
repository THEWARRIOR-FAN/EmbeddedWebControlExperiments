<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PID 调节实验</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f5f7fb; max-width: 1120px; margin: 0 auto; padding: 20px; color: #1f2937; }
    h1 { text-align: center; margin: 0 0 8px; }
    .subtitle { text-align: center; color: #6b7280; margin-bottom: 16px; min-height: 1.5em; transition: opacity .25s ease; cursor: pointer; user-select: none; }
    .subtitle:hover { color: #2563eb; }
    .subtitle.is-changing { opacity: 0; }
    .container { display: flex; gap: 18px; align-items: flex-start; }
    .panel { background: #fff; padding: 18px; border-radius: 10px; box-shadow: 0 2px 10px rgba(15,23,42,.08); }
    .left { width: 330px; }
    .right { flex: 1; }
    h3 { margin: 0 0 12px; }
    .param { margin: 14px 0; }
    label { display: block; font-weight: 700; margin-bottom: 6px; color: #374151; }
    input[type="range"] { width: 100%; }
    .param-control { display: flex; align-items: center; gap: 8px; }
    .value { color: #2563eb; font-weight: 700; min-width: 56px; display: inline-block; text-align: right; }
    .btn { padding: 8px 12px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    .btn:hover { background: #1d4ed8; }
    .btn-auto { background: #16a34a; }
    .btn-auto:hover { background: #15803d; }
    .btn-secondary { background: #6b7280; }
    .btn-secondary:hover { background: #4b5563; }
    .param-btn { width: 34px; height: 34px; padding: 0; margin-top: 0; flex: 0 0 34px; }
    .preset-btn { width: 100%; }
    .info, .status, .tips { line-height: 1.7; font-size: 14px; }
    .pool-box { position: relative; width: 100%; height: 300px; border: 3px solid #6b7280; border-bottom: none; margin: 14px 0 76px; background: #fff; overflow: visible; }
    .water { position: absolute; bottom: 0; width: 100%; background: linear-gradient(180deg, #60a5fa, #2563eb); overflow: hidden; transition: height .08s linear; }
    .water::before { content: ""; position: absolute; left: 0; top: 0; width: 200%; height: 10px; background: repeating-linear-gradient(110deg, rgba(255,255,255,.5) 0 18px, rgba(255,255,255,0) 18px 44px); animation: surfaceFlow 2.8s linear infinite; }
    .water::after { content: ""; position: absolute; left: 0; top: 8px; width: 200%; height: 8px; background: repeating-linear-gradient(70deg, rgba(255,255,255,.18) 0 14px, rgba(255,255,255,0) 14px 38px); animation: surfaceFlow 4.2s linear infinite reverse; }
    .water:not(.has-water)::before, .water:not(.has-water)::after { opacity: 0; }
    .target-line { position: absolute; left: 0; width: 100%; height: 3px; background: #ef4444; z-index: 10; }
    /* 进水管与下落水流 */
    .inlet-pipe { position: absolute; left: 26px; top: -18px; width: 20px; height: 34px; border-radius: 3px; background: linear-gradient(90deg, #94a3b8, #64748b); box-shadow: inset 0 2px 0 rgba(255,255,255,.45); z-index: 20; }
    .inlet-pipe::after { content: ""; position: absolute; left: 3px; bottom: -5px; width: 14px; height: 7px; border-radius: 0 0 4px 4px; background: #475569; }
    .inlet-stream { position: absolute; left: 28px; top: 16px; width: 16px; height: 0; border-radius: 3px 3px 5px 5px; background: linear-gradient(180deg, rgba(96,165,250,.92), rgba(37,99,235,.8)); opacity: 0; z-index: 15; }
    .inlet-stream::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: repeating-linear-gradient(180deg, rgba(255,255,255,.7) 0 4px, rgba(255,255,255,0) 4px 14px); animation: streamFlowDown .35s linear infinite; }
    .inlet-stream::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 24px; height: 9px; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,255,255,.85), rgba(255,255,255,0) 70%); transform: translateX(-50%); animation: splashPulse .45s ease-in-out infinite alternate; }
    /* 出水管与外流水流 */
    .outlet-pipe { position: absolute; right: -18px; bottom: 22px; width: 30px; height: 18px; border-radius: 0 5px 5px 0; background: linear-gradient(180deg, #94a3b8, #64748b); box-shadow: inset 0 2px 0 rgba(255,255,255,.4); z-index: 20; }
    .outlet-pipe::after { content: ""; position: absolute; right: -3px; top: -4px; width: 6px; height: 26px; border-radius: 3px; background: #475569; }
    .outlet-stream { position: absolute; right: -24px; top: calc(100% - 34px); width: 14px; height: 0; border-radius: 3px 3px 6px 6px; background: linear-gradient(180deg, rgba(96,165,250,.92), rgba(37,99,235,.78)); opacity: 0; z-index: 15; transform: rotate(6deg); transform-origin: top center; }
    .outlet-stream::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: repeating-linear-gradient(180deg, rgba(255,255,255,.65) 0 4px, rgba(255,255,255,0) 4px 13px); animation: streamFlowDown .4s linear infinite; }
    .drain-pool { position: absolute; right: -49px; bottom: -70px; width: 44px; height: 10px; border-radius: 3px 3px 8px 8px; background: #cbd5e1; opacity: .8; z-index: 10; }
    .drain-pool::before { content: ""; position: absolute; left: 50%; top: -3px; width: 30px; height: 7px; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,255,255,.9), rgba(255,255,255,0) 70%); transform: translateX(-50%) scale(.6); opacity: 0; }
    .drain-pool.is-receiving::before { opacity: 1; animation: splashPulse .5s ease-in-out infinite alternate; }
    @keyframes surfaceFlow { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes streamFlowDown { from { background-position: 0 0; } to { background-position: 0 14px; } }
    @keyframes splashPulse { from { transform: translateX(-50%) scale(.75); opacity: .5; } to { transform: translateX(-50%) scale(1.25); opacity: .95; } }
    /* 暂停时冻结所有流动动画 */
    .pool-box.is-paused .water::before, .pool-box.is-paused .water::after,
    .pool-box.is-paused .inlet-stream::before, .pool-box.is-paused .inlet-stream::after,
    .pool-box.is-paused .outlet-stream::before, .pool-box.is-paused .drain-pool.is-receiving::before { animation-play-state: paused; }
    @media (prefers-reduced-motion: reduce) { .water::before, .water::after, .inlet-stream::before, .inlet-stream::after, .outlet-stream::before, .drain-pool.is-receiving::before { animation: none; } }
    canvas { width: 100%; height: 260px; border: 1px solid #d1d5db; background: #fafafa; display: block; }
    .status, .tips { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: #f8fafc; border: 1px solid #e5e7eb; }
    .tips { color: #475569; }
    .chart-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
    .chart-head h3 { margin: 0; }
    .chart-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .chart-tools .btn { margin-top: 0; }
    .scrubber-wrap { margin-top: 10px; display: grid; gap: 6px; }
    .scrubber-label { display: flex; justify-content: space-between; gap: 12px; color: #64748b; font-size: 13px; }
    .scrubber { width: 100%; accent-color: #2563eb; }
    .scrubber:disabled { opacity: 0.45; cursor: not-allowed; }

    @media (max-width: 920px) {
      .container { flex-direction: column; }
      .left { width: 100%; }
      .scrubber-label { flex-direction: column; gap: 2px; }
    }
  </style>
</head>
<body>
  <h1>PID 调节实验</h1>
  <div class="subtitle" id="loadingTip" title="点击切换下一条提示" aria-live="polite">调参小贴士：先调 P 到轻微等幅振荡，再加 I 消除静差，最后加 D 抑制超调</div>

  <div class="container">
    <div class="panel left">
      <h3>参数</h3>

      <div class="param">
        <label for="setPoint">目标液位 (m)</label>
        <div class="param-control">
          <button class="btn param-btn" onclick="adjustParam('setPoint', -0.1)">-</button>
          <input type="range" id="setPoint" min="0.2" max="0.8" step="0.1" value="0.6">
          <button class="btn param-btn" onclick="adjustParam('setPoint', 0.1)">+</button>
        </div>
        <span class="value" id="setPointVal">0.6</span>
      </div>

      <div class="param">
        <label for="kp">Kp</label>
        <div class="param-control">
          <button class="btn param-btn" onclick="adjustParam('kp', -0.1)">-</button>
          <input type="range" id="kp" min="0" max="80" step="0.1" value="15.0">
          <button class="btn param-btn" onclick="adjustParam('kp', 0.1)">+</button>
        </div>
        <span class="value" id="kpVal">15.0</span>
      </div>

      <div class="param">
        <label for="ki">Ki</label>
        <div class="param-control">
          <button class="btn param-btn" onclick="adjustParam('ki', -0.1)">-</button>
          <input type="range" id="ki" min="0" max="20" step="0.1" value="0.0">
          <button class="btn param-btn" onclick="adjustParam('ki', 0.1)">+</button>
        </div>
        <span class="value" id="kiVal">0.0</span>
      </div>

      <div class="param">
        <label for="kd">Kd</label>
        <div class="param-control">
          <button class="btn param-btn" onclick="adjustParam('kd', -0.1)">-</button>
          <input type="range" id="kd" min="0" max="20" step="0.1" value="0.0">
          <button class="btn param-btn" onclick="adjustParam('kd', 0.1)">+</button>
        </div>
        <span class="value" id="kdVal">0.0</span>
      </div>

      <button class="btn btn-auto" onclick="autoTune()">一键整定</button>
      <button class="btn btn-secondary" onclick="resetSystem()">重置实验</button>

      <h3 style="margin-top:18px">实验预设</h3>
      <button class="btn preset-btn" onclick="loadPreset('pOnly')">P 控制</button>
      <button class="btn preset-btn" onclick="loadPreset('pi')">PI 控制</button>
      <button class="btn preset-btn" onclick="loadPreset('pid')">PID 控制</button>

      <div class="status" id="tuneStatus">当前为手动调参模式</div>
      <div class="tips">
        建议实验顺序：<br>
        1. 先设 Ki=0、Kd=0，缓慢增大 Kp，直到出现轻微等幅振荡。<br>
        2. 再增加 Ki，观察静差减小到消失。<br>
        3. 最后增加 Kd，压低超调并缩短稳定时间。
      </div>
    </div>

    <div class="panel right">
      <h3>液位响应</h3>
      <div class="pool-box">
        <div class="water" id="water"></div>
        <div class="target-line" id="targetLine"></div>
        <div class="inlet-pipe" aria-hidden="true"></div>
        <div class="inlet-stream" id="inletStream" aria-hidden="true"></div>
        <div class="outlet-pipe" aria-hidden="true"></div>
        <div class="outlet-stream" id="outletStream" aria-hidden="true"></div>
        <div class="drain-pool" aria-hidden="true"></div>
      </div>
      <div class="info">
        当前液位 <span class="value" id="currentLv">0.00</span> m
        &nbsp;&nbsp;阀门开度 <span class="value" id="valve">0</span> %
        &nbsp;&nbsp;误差 <span class="value" id="error">0.00</span> m
        <br>
        理论静差 <span class="value" id="theoryError">0.00</span> m
        &nbsp;&nbsp;延时 <span class="value" id="delayDisplay">16</span> 帧
      </div>
      <div class="chart-head">
        <h3>曲线</h3>
        <div class="chart-tools">
          <button class="btn btn-secondary" id="toggleRunBtn" type="button">暂停</button>
        </div>
      </div>
      <canvas id="chart"></canvas>
      <div class="scrubber-wrap">
        <div class="scrubber-label">
          <span id="scrubberState">运行中：显示最新曲线</span>
          <span id="scrubberRange">0.0s - 0.0s</span>
        </div>
        <input class="scrubber" id="historyScrubber" type="range" min="0" max="0" value="0" disabled>
      </div>
    </div>
  </div>

  <script>
    const tips = [
      "先调 P 到轻微等幅振荡，再加 I 消除静差，最后加 D 抑制超调。",
      "Kp 越大，控制动作越强；太大时可能引起持续振荡。",
      "纯 P 控制通常会留下静差；增加 Ki 可逐步消除静差。",
      "Ki 不宜一次加太多：积分过强可能造成明显超调和较长恢复时间。",
      "Kd 根据误差变化趋势提前制动，常用于减小超调；单独使用不能消除静差。",
      "调参时一次只改一个参数，并观察响应曲线的超调量与稳定时间。",
      "出现等幅振荡说明 Kp 偏大，可适当回调，避免系统长期不稳定。",
      "积分项会累积历史误差，若阀门已达上限（积分饱和），退出饱和需要额外时间。",
      "Kd 对测量噪声敏感：液位信号抖动大时，过强的 D 会让阀门频繁抖动。",
      "先用「一键整定」观察自动结果，再手动微调，理解每个参数的独立作用。",
      "观察「理论静差」读数：纯 P 时它大于 0，加入 I 后应逐渐趋近于 0。",
      "调节目标液位后，记录新稳态的到达时间，对比不同参数下的响应速度。",
      "PI 组合能消除静差，PID 再加 D 通常能同时压低超调、缩短稳定时间。",
      "如果曲线持续发散（振幅越来越大），说明 Kp 过大，应立即减小。",
      "拖动曲线区下方的回放条，可回看任意时刻的液位、阀门与误差历史。"
    ];
    let tipIndex = 0;
    const tipElement = document.getElementById("loadingTip");
    function showNextTip() {
      tipElement.classList.add("is-changing");
      window.setTimeout(() => {
        tipIndex = (tipIndex + 1) % tips.length;
        tipElement.textContent = `调参小贴士：${tips[tipIndex]}`;
        tipElement.classList.remove("is-changing");
      }, 250);
    }
    tipElement.addEventListener("click", showNextTip);
    window.setInterval(showNextTip, 6000);

    let setPoint = 0.6;
    let kp = 15.0;
    let ki = 0.0;
    let kd = 0.0;

    let currentLevel = 0.0;
    let levelSpeed = 0.0;
    let integral = 0.0;
    let valveOpen = 0.0;
    let actuator = 0.0;

    const dt = 1 / 60;
    const delayFrames = 16;      // 纯滞后 16 帧 ≈ 0.27s
    const maxValve = 100;
    // 被控对象：阀门开度 → 进水 → 水位，过程主时间常数约 3.8s
    const inflowGain = 0.18;     // 阀门开度对进水量的增益，与 levelLeak 共同决定过程增益
    const baseLeak = 0;          // 恒定泄漏量，为 0 时理论静差有统一解析式
    const levelLeak = 0.006;     // 出水量与水位成正比
    const plantAccel = 4.5;
    const plantDamping = 0.18;
    const speedMemory = 0.903;   // 水体惯性，速度环节时间常数约 0.17s
    const actuatorLag = 0.12;
    const derivativeFilter = 0.18;
    const levelScale = 55.6;     // 与 plantAccel、levelLeak 共同决定过程时间常数
    const integralLimit = 4.5;   // 积分抗饱和上限
    const visiblePoints = 360;
    const maxStoredPoints = 2400;

    let lastMeasurement = 0.0;
    let filteredDerivative = 0.0;

    let delayQueue = new Array(delayFrames).fill(0);
    let history = [];
    let isPaused = false;
    let viewStartIndex = 0;

    const waterEl = document.getElementById("water");
    const targetLineEl = document.getElementById("targetLine");
    const inletStreamEl = document.getElementById("inletStream");
    const outletStreamEl = document.getElementById("outletStream");
    const poolBoxEl = document.querySelector(".pool-box");
    const drainPoolEl = document.querySelector(".drain-pool");
    const canvas = document.getElementById("chart");
    const ctx = canvas.getContext("2d");
    const toggleRunBtn = document.getElementById("toggleRunBtn");
    const historyScrubber = document.getElementById("historyScrubber");
    const scrubberStateEl = document.getElementById("scrubberState");
    const scrubberRangeEl = document.getElementById("scrubberRange");

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawChart();
    }

    function roundToStep(v, step) {
      return Math.round(v / step) * step;
    }

    function syncUI() {
      document.getElementById("setPoint").value = setPoint;
      document.getElementById("setPointVal").textContent = setPoint.toFixed(1);
      document.getElementById("kp").value = kp;
      document.getElementById("kpVal").textContent = kp.toFixed(1);
      document.getElementById("ki").value = ki;
      document.getElementById("kiVal").textContent = ki.toFixed(1);
      document.getElementById("kd").value = kd;
      document.getElementById("kdVal").textContent = kd.toFixed(1);
      updateTargetLine();
      drawChart();
    }

    function adjustParam(name, delta) {
      const input = document.getElementById(name);
      const step = parseFloat(input.step) || 0.1;
      let value = roundToStep(parseFloat(input.value) + delta, step);
      value = Math.max(parseFloat(input.min), Math.min(parseFloat(input.max), value));

      if (name === "setPoint") setPoint = value;
      if (name === "kp") kp = value;
      if (name === "ki") ki = value;
      if (name === "kd") kd = value;

      // 微调同样不重启系统，参数即时生效
      syncUI();
    }

    function loadPreset(name) {
      if (name === "pOnly") {
        kp = 50.0;
        ki = 0.0;
        kd = 0.0;
        document.getElementById("tuneStatus").textContent = "P 模式：Kp 已进入轻微等幅振荡区，便于观察纯比例控制的静差与持续振荡";
      }
      if (name === "pi") {
        kp = 20.0;
        ki = 2.0;
        kd = 0.0;
        document.getElementById("tuneStatus").textContent = "PI 模式：积分把静差消到 0，但超调比纯 P 更明显";
      }
      if (name === "pid") {
        kp = 20.0;
        ki = 2.0;
        kd = 4.0;
        document.getElementById("tuneStatus").textContent = "PID 模式：与 PI 同样的 Kp、Ki，微分把超调压低并更快稳定";
      }

      // 预设代表一个完整实验场景：应用参数并从空槽重新开始，便于复现文档中的预期现象
      syncUI();
      resetSimState();
    }

    function autoTune() {
      loadPreset("pid");
      document.getElementById("tuneStatus").textContent = "已整定为一组稳定参数：kp=20.0、ki=2.0、kd=4.0";
    }

    function resetSimState() {
      currentLevel = 0.0;
      levelSpeed = 0.0;
      integral = 0.0;
      lastMeasurement = 0.0;
      filteredDerivative = 0.0;
      valveOpen = 0.0;
      actuator = 0.0;
      delayQueue = new Array(delayFrames).fill(0);
      history = [];
      isPaused = false;
      viewStartIndex = 0;
      poolBoxEl.classList.remove("is-paused");
      updateReadout();
      updateScrubberUI();
      drawChart();
    }

    function resetSystem() {
      setPoint = 0.6;
      kp = 15.0;
      ki = 0.0;
      kd = 0.0;
      syncUI();
      resetSimState();
      document.getElementById("tuneStatus").textContent = "已重置：所有参数恢复默认值，系统从空槽重新开始";
    }

    function updateTargetLine() {
      targetLineEl.style.bottom = (setPoint * 100) + "%";
    }

    // 调参不重启系统：参数改动即时生效，系统从当前状态继续响应，便于观察过渡过程
    document.getElementById("setPoint").oninput = function () {
      setPoint = parseFloat(this.value);
      syncUI();
    };

    document.getElementById("kp").oninput = function () {
      kp = parseFloat(this.value);
      syncUI();
    };

    document.getElementById("ki").oninput = function () {
      ki = parseFloat(this.value);
      syncUI();
    };

    document.getElementById("kd").oninput = function () {
      kd = parseFloat(this.value);
      syncUI();
    };

    toggleRunBtn.addEventListener("click", function () {
      isPaused = !isPaused;
      if (!isPaused) {
        viewStartIndex = getLatestViewStart();
      }
      poolBoxEl.classList.toggle("is-paused", isPaused);
      updateScrubberUI();
      drawChart();
    });

    historyScrubber.addEventListener("input", function () {
      viewStartIndex = parseInt(this.value, 10) || 0;
      updateScrubberUI();
      drawChart();
    });

    function getLatestViewStart() {
      return Math.max(0, history.length - visiblePoints);
    }

    function formatTime(index) {
      return (Math.max(0, index) * dt).toFixed(1) + "s";
    }

    function updateScrubberUI() {
      const maxStart = getLatestViewStart();
      if (!isPaused) {
        viewStartIndex = maxStart;
      } else {
        viewStartIndex = Math.max(0, Math.min(viewStartIndex, maxStart));
      }

      historyScrubber.max = String(maxStart);
      historyScrubber.value = String(viewStartIndex);
      historyScrubber.disabled = !isPaused || maxStart === 0;
      toggleRunBtn.textContent = isPaused ? "启动" : "暂停";
      scrubberStateEl.textContent = isPaused ? "已暂停：可拖动滑块回看" : "运行中：显示最新曲线";

      if (history.length === 0) {
        scrubberRangeEl.textContent = "0.0s - 0.0s";
        return;
      }

      const endIndex = Math.min(history.length, viewStartIndex + visiblePoints);
      scrubberRangeEl.textContent = formatTime(viewStartIndex) + " - " + formatTime(endIndex - 1);
    }

    function updateReadout() {
      const error = setPoint - currentLevel;
      const waterPercent = currentLevel * 100;
      waterEl.style.height = waterPercent + "%";
      waterEl.classList.toggle("has-water", currentLevel > 0.002);
      document.getElementById("currentLv").textContent = currentLevel.toFixed(2);
      document.getElementById("valve").textContent = Math.round(actuator);
      document.getElementById("error").textContent = error.toFixed(2);
      document.getElementById("delayDisplay").textContent = delayFrames;

      // 进/出水动画强度跟随当前阀门开度与水位
      const poolHeight = 300;
      const valveRatio = actuator / maxValve;
      const inflow = inflowGain * valveRatio;
      const outflow = baseLeak + levelLeak * currentLevel;
      const inletRatio = Math.min(1, inflow / inflowGain);
      const outletRatio = Math.min(1, outflow / (levelLeak + baseLeak));

      // 进水流长度精确接到当前水面（起点距池顶16px）
      const surfaceY = poolHeight * (1 - currentLevel);
      const inletHeight = Math.max(0, surfaceY - 16);
      inletStreamEl.style.height = inletHeight.toFixed(1) + "px";
      inletStreamEl.style.width = (8 + inletRatio * 10).toFixed(1) + "px";
      inletStreamEl.style.opacity = inletRatio > 0.01 ? String(0.4 + inletRatio * 0.6) : "0";

      // 出水流长度接到接水槽（槽顶距池底约70px），粗细随出水量变化
      const outletHeight = outletRatio * 94;
      outletStreamEl.style.height = outletHeight.toFixed(1) + "px";
      outletStreamEl.style.width = (6 + outletRatio * 8).toFixed(1) + "px";
      outletStreamEl.style.opacity = outletRatio > 0.01 ? String(0.4 + outletRatio * 0.6) : "0";
      drainPoolEl.classList.toggle("is-receiving", outletRatio > 0.01);

      // 理论稳态误差：积分未饱和时由积分作用消除；饱和时按阀位平衡解出残余静差
      const valveRange = 100 * levelLeak / inflowGain;
      const theoryError = Math.max(0, (valveRange * setPoint - integralLimit * ki) / (kp + valveRange));
      document.getElementById("theoryError").textContent = theoryError.toFixed(3);
    }

    function pidControl() {
      const error = setPoint - currentLevel;
      const measurementDerivative = (currentLevel - lastMeasurement) / dt;
      filteredDerivative += derivativeFilter * (measurementDerivative - filteredDerivative);

      integral += error * dt;
      integral = Math.max(-integralLimit, Math.min(integralLimit, integral));

      const command = kp * error + ki * integral - kd * filteredDerivative;
      valveOpen = Math.max(0, Math.min(maxValve, command));
      lastMeasurement = currentLevel;

      delayQueue.push(valveOpen);
      const delayedValve = delayQueue.shift();

      actuator += actuatorLag * (delayedValve - actuator);
      const valveRatio = actuator / maxValve;
      const inflow = inflowGain * valveRatio;
      const outflow = baseLeak + levelLeak * currentLevel;

      const accel = plantAccel * (inflow - outflow) - plantDamping * levelSpeed;
      levelSpeed = speedMemory * levelSpeed + accel * dt;
      currentLevel = Math.max(0, Math.min(1, currentLevel + levelSpeed * dt * levelScale));

      if (currentLevel <= 0 && levelSpeed < 0) levelSpeed = 0;
      if (currentLevel >= 1 && levelSpeed > 0) levelSpeed = 0;

      updateReadout();

      history.push(currentLevel);
      if (history.length > maxStoredPoints) {
        history.shift();
        if (isPaused && viewStartIndex > 0) viewStartIndex -= 1;
      }

      updateScrubberUI();
      drawChart();
    }

    function drawChart() {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      const start = isPaused ? viewStartIndex : getLatestViewStart();
      const end = Math.min(history.length, start + visiblePoints);

      ctx.clearRect(0, 0, w, h);

      ctx.strokeStyle = "#e5e7eb";
      ctx.lineWidth = 1;
      for (let i = 1; i < 5; i++) {
        const gy = (h / 5) * i;
        ctx.beginPath();
        ctx.moveTo(0, gy);
        ctx.lineTo(w, gy);
        ctx.stroke();
      }

      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 2;
      ctx.beginPath();
      const ty = h - setPoint * h;
      ctx.moveTo(0, ty);
      ctx.lineTo(w, ty);
      ctx.stroke();

      ctx.strokeStyle = "#2563eb";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = start; i < end; i++) {
        const val = history[i];
        if (val == null) continue;
        const progress = end - start <= 1 ? 0 : (i - start) / (end - start - 1);
        const x = progress * w;
        const y = h - val * h;
        if (i === start) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    function loop() {
      if (!isPaused) pidControl();
      requestAnimationFrame(loop);
    }

    syncUI();
    updateReadout();
    updateScrubberUI();
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);
    loop();
  </script>
</body>
</html>
